<script>
document.addEventListener("DOMContentLoaded", function() {
    // Naloži navigacijo iz nav.html
    fetch("../nav2.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("nav-placeholder").innerHTML = data;

            // Po nalaganju navigacije doda funkcionalnost hamburger meniju
            let hamburger = document.querySelector(".hamburger");
            let navMenu = document.querySelector("nav ul");

            if (hamburger && navMenu) {
                hamburger.addEventListener("click", function() {
                    navMenu.classList.toggle("show"); // Preklopi meni
                });
            }
        })
        .catch(error => console.error("Napaka pri nalaganju navigacije:", error));
});

</script>

    <div id="nav-placeholder"></div>
   
    <main>
        <div class="row">

            <div class="col-7 main">
                <h1 style="text-align: center;"><span style="color:red; font-size: 20px;">2024/25</span> - Fantasy Koroška - <span style="color:red; font-size: 20px;">sezona 8</span> </h1>
                <h2 style="text-align: center;">DRAFT COUNTDOWN:</h2>
                <p id="demo"></p>
                <script>
                    // Set the date we're counting down to
                    var countDownDate = new Date("Oct 19, 2025 21:30:00").getTime();

                    // Update the count down every 1 second
                    var x = setInterval(function () {

                        // Get today's date and time
                        var now = new Date().getTime();

                        // Find the distance between now and the count down date
                        var distance = countDownDate - now;

                        // Time calculations for days, hours, minutes and seconds
                        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        // Output the result in an element with id="demo"
                        document.getElementById("demo").innerHTML = days + "d " + hours + "h "
                            + minutes + "m " + seconds + "s ";

                        // If the count down is over, write some text
                        if (distance < 0) {
                            clearInterval(x);
                            document.getElementById("demo").innerHTML = "SEASON TIME";
                        }
                    }, 1000);
                </script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Nalozi sidenav (datoteka v isti mapi)
        fetch("sidenavMemedump.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("sidenav-placeholder").outerHTML = html;
                // Označi trenutno stran v sidenavu (glej ".col-2.sidenav a.active" v styles.css)
                var sidenavHere = (location.pathname.split('/').pop() || 'index.html');
                document.querySelectorAll('.col-2.sidenav a').forEach(function(a){
